# Default configuration for the case display visualizer.
#
# To override without touching this file (e.g. for machine-specific
# tweaks), copy this to config.local.toml -- that file is gitignored and
# takes precedence when present.

[sensors]
cpu = true
gpu = true
audio = true
input = true

[display]
# One of: slow, normal, fast
speed = "normal"
# One of:
#   auto        - cycles through the named themes below over time
#   cyan, amber, magenta, matrix (or any theme from themes.local.toml)
#   prism       - rainbow: every element shares one hue, shifting together
#   aurora      - rainbow: hue sweeps/chases across rings and equalizer bands
# Rainbow cycle speed follows the "speed" setting above.
theme = "auto"
# Line thickness of the rotating polygons, 1 (default) to 6 pixels
line_thickness = 1
# Starfield scroll direction. One of: left (default), right, up, down,
# away (tunnel effect, receding), towards (tunnel effect, warp speed)
starfield_direction = "left"
# Equalizer layout. One of:
#   bottom - classic bar row along the bottom edge (default)
#   radial - bars radiate outward from a circle enclosing the hex rings;
#            the rings are fixed at 4 and made smaller to fit. Loud audio
#            can push bars past the screen edge -- that's expected.
equalizer_style = "bottom"
# Whether the hex-ring center (and, when relevant, the radial equalizer and
# tunnel starfield) slowly wanders around the screen instead of staying
# fixed in the middle.
moving_center = true
